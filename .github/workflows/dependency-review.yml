# ─────────────────────────────────────────────────────────────────────────────
# Dependency review for pull requests
#
# Fails a pull request that introduces a high or critical vulnerability. The
# repository's dependency graph must be enabled (public repositories have it by
# default). This complements npm audit and CodeQL.
# ─────────────────────────────────────────────────────────────────────────────

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
