# ─────────────────────────────────────────────────────────────────────────────
# DerList CI Pipeline
#
# Runs on every push to main and on pull requests.
# Steps: lint, typecheck, prisma validate, prisma generate, migrate, test, build,
# then a Docker runtime verification of the production image and compose stack.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/derlist_test
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: derlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      # The suite includes database-backed ownership tests, so the schema
      # must exist before the tests run.
      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  docker-verify:
    name: Docker Runtime Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci

    # CI-only values. None of these are production credentials.
    env:
      POSTGRES_USER: derlist_ci
      POSTGRES_PASSWORD: ci_only_password
      POSTGRES_DB: derlist_ci
      ADMIN_EMAIL: ci-owner@example.test
      ADMIN_USERNAME: ciowner
      ADMIN_DISPLAY_NAME: CI Owner
      ADMIN_PASSWORD: ci_only_password
      PROVIDER_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_PORT: '3000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docker compose reads this file for variable substitution. The same
      # patterns are excluded from the build context by .dockerignore, so the
      # image never contains it.
      - name: Write the compose environment file
        run: |
          set -euo pipefail
          {
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_DB=$POSTGRES_DB"
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "ADMIN_USERNAME=$ADMIN_USERNAME"
            echo "ADMIN_DISPLAY_NAME=$ADMIN_DISPLAY_NAME"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "PROVIDER_ENCRYPTION_KEY=$PROVIDER_ENCRYPTION_KEY"
            echo "NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL"
            echo "APP_PORT=$APP_PORT"
          } > .env

      - name: Build and start the production stack
        run: docker compose up -d --build

      - name: Wait for the app container to report healthy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo unknown)
            echo "attempt $attempt: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs app
              exit 1
            fi
            sleep 5
          done
          echo "The app never became healthy."
          docker compose logs app
          docker compose logs db
          exit 1

      - name: Verify HTTP endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/api/health | tee /tmp/health.json
          login_code=$(curl -s -o /tmp/login.html -w '%{http_code}' http://localhost:3000/login)
          echo "GET /login -> $login_code"
          test "$login_code" = "200"
          grep -qi 'sign in\|password' /tmp/login.html

          register_code=$(curl -s -o /tmp/register.html -w '%{http_code}' http://localhost:3000/register)
          echo "GET /register -> $register_code"
          test "$register_code" = "200"
          grep -qi 'create your account' /tmp/register.html

          recovery_code=$(curl -s -o /tmp/recovery.html -w '%{http_code}' http://localhost:3000/forgot-password)
          echo "GET /forgot-password -> $recovery_code"
          test "$recovery_code" = "200"

      - name: Verify the runtime user and image contents
        run: |
          set -euo pipefail
          uid=$(docker compose exec -T app id -u | tr -d '\r')
          echo "container uid: $uid"
          test "$uid" = "1001"

          echo "--- environment files inside the image ---"
          docker compose exec -T app sh -lc \
            'find /app -maxdepth 3 -name ".env*" -print' | tee /tmp/env-files.txt
          test ! -s /tmp/env-files.txt
          docker compose exec -T app sh -lc 'test ! -e /app/.env && test ! -e /app/.env.production'

          echo "--- build and test artifacts inside the image ---"
          docker compose exec -T app sh -lc \
            'test ! -e /app/tests && test ! -e /app/.git && test ! -e /app/test-results'

          echo "--- worker runtime available in the same image ---"
          docker compose exec -T app sh -lc 'test -x /app/node_modules/.bin/tsx'

          echo "--- image metadata and size ---"
          image=$(docker compose images -q app)
          docker image inspect "$image" \
            --format 'User={{.Config.User}} WorkDir={{.Config.WorkingDir}} Entrypoint={{.Config.Entrypoint}} Size={{.Size}}'
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -5

      - name: Verify migrations, seed and PostgreSQL persistence
        run: |
          set -euo pipefail
          docker compose exec -T app npx prisma migrate status | tee /tmp/migrate.txt
          grep -q 'Database schema is up to date' /tmp/migrate.txt

          migrations_before=$(docker compose exec -T app sh -lc \
            'psql "$DATABASE_URL" -tAc "select count(*) from _prisma_migrations"' | tr -d '\r[:space:]')
          users_before=$(docker compose exec -T app sh -lc \
            'psql "$DATABASE_URL" -tAc "select count(*) from users"' | tr -d '\r[:space:]')
          echo "applied migrations: $migrations_before, users: $users_before"
          test "$users_before" = "1"

          # Stop the worker first so the database restart is a controlled
          # outage rather than a mid-flight connection drop.
          docker compose stop worker

          echo "--- restarting PostgreSQL ---"
          docker compose restart db
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q db)")" = "healthy"

          migrations_after=$(docker compose exec -T app sh -lc \
            'psql "$DATABASE_URL" -tAc "select count(*) from _prisma_migrations"' | tr -d '\r[:space:]')
          users_after=$(docker compose exec -T app sh -lc \
            'psql "$DATABASE_URL" -tAc "select count(*) from users"' | tr -d '\r[:space:]')
          echo "after restart -> migrations: $migrations_after, users: $users_after"
          test "$migrations_after" = "$migrations_before"
          test "$users_after" = "$users_before"

          # Bring the worker back against the persisted database and require a
          # second clean start in the same container.
          docker compose start worker
          for attempt in $(seq 1 30); do
            if [ "$(docker compose logs --no-color worker | grep -c 'worker.started')" -ge 2 ]; then
              break
            fi
            sleep 2
          done
          test "$(docker compose logs --no-color worker | grep -c 'worker.started')" -ge 2
          test "$(docker inspect --format '{{.State.Status}}' "$(docker compose ps -q worker)")" = "running"
          test "$(docker inspect --format '{{.RestartCount}}' "$(docker compose ps -q worker)")" = "0"

      - name: Verify uploads persist across a container restart
        run: |
          set -euo pipefail
          docker inspect --format '{{range .Mounts}}{{.Destination}}{{"\n"}}{{end}}' \
            "$(docker compose ps -q app)" | tee /tmp/mounts.txt
          grep -qx '/app/uploads' /tmp/mounts.txt

          docker compose exec -T app sh -lc \
            'printf "persisted\n" > /app/uploads/ci-persistence.txt'
          docker compose restart app

          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            if [ "$status" = "healthy" ]; then break; fi
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = "healthy"

          docker compose exec -T app cat /app/uploads/ci-persistence.txt | grep -qx persisted
          echo "uploaded file survived the restart"

      - name: Verify the worker service
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker compose logs --no-color worker | grep -q 'worker.started'; then
              break
            fi
            sleep 2
          done
          docker compose logs --no-color worker | grep -q 'worker.started'

          docker compose ps
          state=$(docker inspect --format '{{.State.Status}}' "$(docker compose ps -q worker)")
          restarts=$(docker inspect --format '{{.RestartCount}}' "$(docker compose ps -q worker)")
          echo "worker state: $state, restarts: $restarts"
          test "$state" = "running"
          test "$restarts" = "0"
          docker compose exec -T worker sh -lc 'test -x node_modules/.bin/tsx'
          docker compose logs --no-color worker | tail -20

      - name: Check container logs for startup errors
        run: |
          set -euo pipefail
          docker compose logs --no-color app > /tmp/app.log
          docker compose logs --no-color worker > /tmp/worker.log
          if grep -nE '❌|Unhandled|FATAL|Error:|worker\.fatal' /tmp/app.log /tmp/worker.log; then
            echo "Startup errors were found in the container logs."
            exit 1
          fi
          echo "--- app log tail ---"
          tail -20 /tmp/app.log

      - name: Stop the stack
        if: always()
        run: docker compose down -v
