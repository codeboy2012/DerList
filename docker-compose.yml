# ─────────────────────────────────────────────────────────────────────────────
# DerList — One-Command Production Deployment
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d   # done
#
# Everything is automatic:
#   - PostgreSQL starts and becomes healthy
#   - App waits for DB, runs migrations, generates Prisma Client, then starts
#   - Caddy provisions HTTPS certificates and proxies traffic
#
# No manual commands required. Ever.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-derlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-derlist}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-derlist} -d ${POSTGRES_DB:-derlist}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - derlist
    # Not exposed to host by default — access via internal network only.
    # Uncomment below for local debugging:
    # ports:
    #   - "5432:5432"
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─── DerList Application ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-derlist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-derlist}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: production
    ports:
      - '${APP_PORT:-3000}:3000'
    networks:
      - derlist
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─── Caddy — Automatic HTTPS Reverse Proxy ─────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - derlist
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─── Optional: Redis (uncomment when needed) ────────────────────────────────
  # redis:
