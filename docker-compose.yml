# ─────────────────────────────────────────────────────────────────────────────
# DerList — One-Command Production Deployment
#
# Usage:
#   git clone https://github.com/codeboy2012/DerList
#   cd DerList
#   cp .env.example .env   # fill in secrets
#   docker compose up -d   # done
#
# Everything is automatic:
#   - PostgreSQL starts and becomes healthy
#   - App waits for DB, runs migrations, seeds if empty, then starts
#   - Caddy provisions HTTPS certificates and proxies traffic
#
# No manual commands required. Ever.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-derlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-derlist}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-derlist} -d ${POSTGRES_DB:-derlist}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - derlist
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    # Uncomment to expose PostgreSQL to the host for debugging:
    # ports:
    #   - "5432:5432"

  # ─── DerList Application ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      # DATABASE_URL is constructed from the Postgres vars — do not set it in .env
      DATABASE_URL: postgresql://${POSTGRES_USER:-derlist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-derlist}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    networks:
      - derlist
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─── Caddy — Automatic HTTPS Reverse Proxy ─────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - derlist
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # ─────────────────────────────────────────────────────────────────────────────
