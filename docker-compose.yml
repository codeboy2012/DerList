# ─────────────────────────────────────────────────────────────────────────────
# DerList Production Docker Compose
#
# Usage:
#   cp .env.example .env   (fill in secrets)
#   docker compose up -d
#
# Services:
#   - db:    PostgreSQL 16 database
#   - app:   Next.js application (auto-migrates on startup)
#   - caddy: Reverse proxy with automatic HTTPS (optional, remove if unneeded)
#
# The app service automatically:
#   1. Waits for PostgreSQL to be healthy
#   2. Runs pending Prisma migrations
#   3. Seeds the database with an owner account (first run only)
#   4. Starts the Next.js server
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-derlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-derlist}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-derlist} -d ${POSTGRES_DB:-derlist}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - derlist

  # ── DerList Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-derlist}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-derlist}
      # Application
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
      # Authentication
      AUTH_SECRET: ${AUTH_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Provider encryption
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      # Admin seed (only used on first run)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    networks:
      - derlist

  # ── Caddy Reverse Proxy (optional — remove if using your own reverse proxy) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - with-caddy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - derlist

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  derlist:
    driver: bridge
